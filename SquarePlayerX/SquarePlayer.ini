[Metadata]
Name = SquarePlayer X
Author = Meti0X7CB (modified by sol, experimental rework)
Information = "Buttonless dynamic-width media widget. Experimental build: WebNowPlaying 3.x (desktop + browser players), adaptive visualizer, portable fonts."
Version = 4.0-x
License = GNU General Public License v3.0

[Rainmeter]
Update = #UpdateRate#
AccurateText = 1
DynamicWindowSize = 1

[Variables]
Scale = 1.15
Color = 240,240,240
SubColor = 199,199,199
Highlight = 53,174,230
FrostLevel = Acrylic
Theme = Dark
CornerType = Round
; Active = whichever player Windows/WebNowPlaying considers current. A number pins a specific player id.
PlayerId = Active

; Put fonts in @Resources\Fonts (see the README there); they load automatically. Then set the names below.
TitleFont = HaasGrot Text 55 Rm Trial
ArtistFont = EpocaPro-MediumItalic

IconZone = (50*#Scale#)
VisualizerZone = (80*#Scale#)
Padding = (20*#Scale#)
MinTextZone = (250*#Scale#)
MaxTextZone = (600*#Scale#)
MaxWidgetWidth = (900*#Scale#)

; ---- VISUALIZER (unscaled px; Engine.lua applies Scale) ----
; 33ms = ~30fps. 16 = ~60fps (smoother, more CPU). 50 = lighter.
UpdateRate = 33
VizHeight = 36
VizBarWidth = 2
VizSpacing = 6
VizMinBar = 0
VizRadius = 0
VizGain = 1
; 0..1: how much quiet frequency bands get lifted so every bar stays alive
VizWhiten = 0.6
VizMaxBoost = 0.25
; smaller = punchier/more contrast, larger = calmer
VizRange = 0.4
VizGate = 0.04
VizAttackMs = 25
VizReleaseMs = 160

; ---------------- MEASURES ----------------

[MeasureStatus]
Measure = Plugin
Plugin = WebNowPlaying
PlayerType = Status
PlayerId = #PlayerId#
UpdateDivider = 8
IfCondition = MeasureStatus = 1
IfTrueAction = [!ShowMeterGroup "Active"]
IfFalseAction = [!HideMeterGroup "Active"]

[MeasureCover]
Measure = Plugin
Plugin = WebNowPlaying
PlayerType = Cover
PlayerId = #PlayerId#
DefaultPath = #@#Default.png
UpdateDivider = 8

[MeasureTitle]
Measure = Plugin
Plugin = WebNowPlaying
PlayerType = Title
PlayerId = #PlayerId#
UpdateDivider = 8
; old version used "0":"" which deleted every 0 inside titles ("2020" -> "22")
RegExpSubstitute = 1
Substitute = "^0$":""

[MeasureArtist]
Measure = Plugin
Plugin = WebNowPlaying
PlayerType = Artist
PlayerId = #PlayerId#
UpdateDivider = 8
RegExpSubstitute = 1
Substitute = "^0$":""

[MeasureProgress]
Measure = Plugin
Plugin = WebNowPlaying
PlayerType = Progress
PlayerId = #PlayerId#
UpdateDivider = 15
; plugin returns 0-100; without this the bar meter treats anything >1 as full
MinValue = 0
MaxValue = 100

@Include = #@#Audio.inc

[MeasureEngine]
Measure = Script
ScriptFile = #@#Scripts\Engine.lua

; ---------------- FROST ----------------

[FrostedGlass]
Measure = Plugin
Plugin = FrostedGlass
Type = #FrostLevel#
Border = None
Corner = #CornerType#
Backdrop = #Theme#
BorderVisible = 0

; ---------------- CANVAS ----------------
; Width of canvas / text / progress is set by Engine.lua only when the text width changes.

[MeterCanvas]
Meter = Shape
Shape = Rectangle 0,0,(#MinTextZone#+#IconZone#+#VisualizerZone#+#Padding#),(48*#Scale#),5 | Fill Color 0,0,0,1 | StrokeWidth 0

; ---------------- COVER ----------------

[MeterCoverContainer]
Meter = Shape
Shape = Rectangle 0,0,(32*#Scale#),(32*#Scale#),5 | Fill Color 0,0,0,255 | StrokeWidth 0
X = (10*#Scale#)
Y = (8*#Scale#)

[MeterCover]
Meter = Image
MeasureName = MeasureCover
W = (32*#Scale#)
H = (32*#Scale#)
Container = MeterCoverContainer
PreserveAspectRatio = 2
Group = Active

; ---------------- TEXT ----------------

[StyleText]
X = #IconZone#
FontSize = (9*#Scale#)
FontWeight = 600
AntiAlias = 1

; Invisible probes: natural text width (capped at MaxTextZone, one line), read by Engine.lua.
; Transparent instead of Hidden=1, because hidden meters don't measure themselves (they report W=0).
[StyleProbe]
Y = (8*#Scale#)
ClipString = 2
ClipStringW = #MaxTextZone#
ClipStringH = (14*#Scale#)
FontColor = 0,0,0,0

[MeterTitleProbe]
Meter = String
MeterStyle = StyleText | StyleProbe
MeasureName = MeasureTitle
FontFace = #TitleFont#

[MeterArtistProbe]
Meter = String
MeterStyle = StyleText | StyleProbe
MeasureName = MeasureArtist
FontFace = #ArtistFont#

[MeterTitle]
Meter = String
MeterStyle = StyleText
MeasureName = MeasureTitle
W = #MinTextZone#
ClipString = 1
Y = (8*#Scale#)
FontColor = #Color#
FontFace = #TitleFont#
Group = Active

[MeterArtist]
Meter = String
MeterStyle = StyleText
MeasureName = MeasureArtist
W = #MinTextZone#
ClipString = 1
Y = (24*#Scale#)
FontColor = #SubColor#
FontFace = #ArtistFont#
Group = Active

; ---------------- PROGRESS ----------------

[MeterProgress]
Meter = Bar
MeasureName = MeasureProgress
X = (8*#Scale#)
Y = (44*#Scale#)
H = (2*#Scale#)
W = (#MinTextZone#+#IconZone#+#VisualizerZone#+#Padding#-16*#Scale#)
BarOrientation = Horizontal
BarColor = #Highlight#
SolidColor = 0,0,0,0
Group = Active

; ---------------- VISUALIZER ----------------
; Shapes are rewritten by Engine.lua; one ShapeN per MeasureBandN in Audio.inc.

[MeterBands]
Meter = Shape
Shape   = Rectangle 0,0,0,0 | Extend Style
Shape2  = Rectangle 0,0,0,0 | Extend Style
Shape3  = Rectangle 0,0,0,0 | Extend Style
Shape4  = Rectangle 0,0,0,0 | Extend Style
Shape5  = Rectangle 0,0,0,0 | Extend Style
Shape6  = Rectangle 0,0,0,0 | Extend Style
Shape7  = Rectangle 0,0,0,0 | Extend Style
Shape8  = Rectangle 0,0,0,0 | Extend Style
Shape9  = Rectangle 0,0,0,0 | Extend Style
Shape10 = Rectangle 0,0,0,0 | Extend Style
Style = Fill Color #Color# | StrokeWidth 0
AntiAlias = 1
Group = Active
